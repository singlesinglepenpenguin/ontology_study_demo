<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img"><title>AI 与本体协作：查询、计算、建议、执行</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#687b92" stroke-width="1.5"/></marker></defs><rect width="1200" height="635" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#142b49">AI 与本体协作：查询、计算、建议、执行</text><text x="48" y="94" font-size="17" fill="#5e7188">模型负责理解与组织任务；业务工具负责返回事实、计算结果和执行状态</text>
<rect x="48" y="140" width="316" height="140" rx="14" fill="white" stroke="#d8e2ef"/><rect x="48" y="155" width="4" height="26" rx="2" fill="#2761bb"/>
<text x="68" y="174" font-size="21" font-weight="600" fill="#2761bb">01  理解任务</text>
<text x="68" y="209" font-size="17" font-weight="400" fill="#506580">供应商延期，哪些订单受影响？</text>
<text x="68" y="236" font-size="17" font-weight="400" fill="#506580">AI 识别对象和用户意图</text>
<rect x="442" y="140" width="316" height="140" rx="14" fill="white" stroke="#d8e2ef"/><rect x="442" y="155" width="4" height="26" rx="2" fill="#2761bb"/>
<text x="462" y="174" font-size="21" font-weight="600" fill="#2761bb">02  查询与计算</text>
<text x="462" y="209" font-size="17" font-weight="400" fill="#506580">查询订单关系，调用计算函数</text>
<text x="462" y="236" font-size="17" font-weight="400" fill="#506580">返回有来源的事实和金额</text>
<rect x="836" y="140" width="316" height="140" rx="14" fill="white" stroke="#d8e2ef"/><rect x="836" y="155" width="4" height="26" rx="2" fill="#2761bb"/>
<text x="856" y="174" font-size="21" font-weight="600" fill="#2761bb">03  形成提案</text>
<text x="856" y="209" font-size="17" font-weight="400" fill="#506580">比较备选供应商和额外成本</text>
<text x="856" y="236" font-size="17" font-weight="400" fill="#506580">说明依据、假设与不确定性</text>
<rect x="836" y="360" width="316" height="140" rx="14" fill="white" stroke="#d8e2ef"/><rect x="836" y="375" width="4" height="26" rx="2" fill="#157b70"/>
<text x="856" y="394" font-size="21" font-weight="600" fill="#157b70">04  校验与审批</text>
<text x="856" y="429" font-size="17" font-weight="400" fill="#506580">后端检查权限、库存与预算</text>
<text x="856" y="456" font-size="17" font-weight="400" fill="#506580">按业务要求取得人工审批</text>
<rect x="442" y="360" width="316" height="140" rx="14" fill="white" stroke="#d8e2ef"/><rect x="442" y="375" width="4" height="26" rx="2" fill="#157b70"/>
<text x="462" y="394" font-size="21" font-weight="600" fill="#157b70">05  执行操作</text>
<text x="462" y="429" font-size="17" font-weight="400" fill="#506580">调用 Action 更新订单</text>
<text x="462" y="456" font-size="17" font-weight="400" fill="#506580">连接已配置的业务系统</text>
<rect x="48" y="360" width="316" height="140" rx="14" fill="white" stroke="#d8e2ef"/><rect x="48" y="375" width="4" height="26" rx="2" fill="#157b70"/>
<text x="68" y="394" font-size="21" font-weight="600" fill="#157b70">06  记录与反馈</text>
<text x="68" y="429" font-size="17" font-weight="400" fill="#506580">保存执行结果和业务变化</text>
<text x="68" y="456" font-size="17" font-weight="400" fill="#506580">用于追踪效果与后续决策</text>
