<text x="370" y="396" font-size="17" font-weight="400" fill="#506580">供应商提供的物料</text>
<rect x="625" y="327" width="230" height="107" rx="14" fill="white" stroke="#d8e2ef"/><rect x="625" y="342" width="4" height="26" rx="2" fill="#2761bb"/>
<text x="645" y="361" font-size="21" font-weight="600" fill="#2761bb">订单 O1</text>
<text x="645" y="396" font-size="17" font-weight="400" fill="#506580">物料数量、金额、交期</text>
<rect x="900" y="327" width="230" height="107" rx="14" fill="white" stroke="#d8e2ef"/><rect x="900" y="342" width="4" height="26" rx="2" fill="#2761bb"/>
