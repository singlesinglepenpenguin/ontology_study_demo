<text x="822" y="574" font-size="17" font-weight="400" fill="#506580">权限、审批与过程记录</text>
<text x="48" y="634" font-size="15" font-weight="400" fill="#6b7d93">基于 Palantir 官方概念整理；对象和数据为本文教学示例。</text>
