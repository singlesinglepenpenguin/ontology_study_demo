<rect x="425" y="125" width="350" height="100" rx="14" fill="white" stroke="#d8e2ef"/><rect x="425" y="140" width="4" height="26" rx="2" fill="#2761bb"/>
<text x="445" y="159" font-size="21" font-weight="600" fill="#2761bb">销售需求</text>
<text x="445" y="194" font-size="17" font-weight="400" fill="#506580">客户、订单、交付日期</text>
<path d="M600,225 L600,265" stroke="#687b92" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="802" y="125" width="350" height="100" rx="14" fill="white" stroke="#d8e2ef"/><rect x="802" y="140" width="4" height="26" rx="2" fill="#2761bb"/>
<text x="822" y="159" font-size="21" font-weight="600" fill="#2761bb">库存记录</text>
<text x="822" y="194" font-size="17" font-weight="400" fill="#506580">物料、库存、可用数量</text>
<path d="M977,225 L977,265" stroke="#687b92" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="270" width="1104" height="190" rx="16" fill="#eaf1fc" stroke="#b7ccec"/>
<text x="70" y="305" font-size="22" font-weight="600" fill="#24549c">共同的业务含义：对象、属性与关系</text>
