<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>从分散的数据，到可执行的业务模型</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#687b92" stroke-width="1.5"/></marker></defs><rect width="1200" height="650" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#142b49">从分散的数据，到可执行的业务模型</text><text x="48" y="94" font-size="17" fill="#5e7188">概念示意：以供应商延期与订单处理为例</text>
