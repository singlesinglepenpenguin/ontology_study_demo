object_types:
  Material:
    description: 物料品类，包含毛利率、品类标签等信息
    properties:
      materialId:
        type: string
        required: true
        primary_key: true
        description: 物料编号（格式：MAT-XXX）
      name:
        type: string
        required: true
        description: 物料名称
      category:
        type: string
        required: true
        description: 物料类别（电子料/结构件/包装材料/芯片组）
      margin:
        type: number
        required: true
        description: 毛利率（百分比，如0.35表示35%）
      label:
        type: string
        required: true
        description: 品类标签（leveraged_competitive/leveraged_preferred/co_creation/general）
      unit:
        type: string
        required: false
        description: 计量单位（pcs/kg/set）
      annualDemand:
        type: integer
        required: false
        description: 年需求量
      currentStock:
        type: integer
        required: false
        description: 当前库存
      primarySupplierId:
        type: string
        required: false
        description: 首选供应商ID
      status:
        type: string
        required: false
        description: 状态（active/discontinued）
      reservedStock:
        type: integer
        description: 已预留库存，不可供本轮新增需求使用
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      suppliedBy:
        target: Supplier
        foreign_key: primarySupplierId
  Supplier:
    description: 供应商实体，包含产能、质量、交付等多维绩效数据
    properties:
      supplierId:
        type: string
        primary_key: true
        required: true
        description: 供应商编号
      name:
        type: string
        required: true
        description: 供应商名称
      region:
        type: string
        required: true
        description: 所在区域（华南/华东/华北/海外）
      capacity:
        type: integer
        required: true
        description: 月产能（件数）
      yieldRate:
        type: number
        required: true
        description: 良品率（0-1）
      deliveryTimeliness:
        type: number
        required: true
        description: 交付及时率（0-1）
      qualityScore:
        type: number
        required: false
        description: 质量评分（0-100）
      priceIndex:
        type: number
        required: false
        description: 价格指数（基准100）
      leadTimeDays:
        type: integer
        required: false
        description: 交货周期（天）
      certLevel:
        type: string
        required: false
        description: 认证等级（A/B/C）
      status:
        type: string
        required: true
        description: active 或 inactive
      delayDays:
        type: integer
        required: true
        description: 本次供货延期天数
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
  AllocationPlan:
    description: 分货计划，针对某物料在某个周期的分配方案
    properties:
      planId:
        type: string
        required: true
        primary_key: true
        description: 计划编号（格式：PLAN-XXX）
      materialId:
        type: string
        required: true
        description: 关联物料ID
      period:
        type: string
        required: true
        description: 分配周期（格式：YYYY-MM）
      totalQuantity:
        type: integer
        required: true
        description: 计划分配总量
      status:
        type: string
        required: true
        description: 状态（draft/confirmed/executing/completed）
      strategy:
        type: string
        required: false
        description: 分配策略（cost_optimized/quality_priority/balanced）
      note:
        type: string
        required: false
        description: 备注
      createdAt:
        type: string
        required: false
        description: 创建时间
      updatedAt:
        type: string
        required: false
        description: 最后更新时间
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      forMaterial:
        target: Material
        foreign_key: materialId
  AllocationBatch:
    description: 分货批次，一个计划下分配给某个供应商的具体批次
    properties:
      batchId:
        type: string
        required: true
        primary_key: true
        description: 批次编号（格式：BATCH-XXX）
      planId:
        type: string
        required: true
        description: 所属计划ID
      supplierId:
        type: string
        required: true
        description: 分配的供应商ID
      materialId:
        type: string
        required: true
        description: 物料ID
      allocatedQty:
        type: integer
        required: true
        description: 计划分配数量
      confirmedQty:
        type: integer
        required: false
        description: 供应商确认数量
      deliveredQty:
        type: integer
        required: false
        description: 已交付数量
      unitPrice:
        type: number
        required: false
        description: 单价
      status:
        type: string
        required: true
        description: 状态（pending/confirmed/in_transit/delivered/cancelled）
      createdAt:
        type: string
        required: false
        description: 创建时间
      updatedAt:
        type: string
        required: false
        description: 最后更新时间
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      belongsToPlan:
        target: AllocationPlan
        foreign_key: planId
      assignedTo:
        target: Supplier
        foreign_key: supplierId
      forMaterial:
        target: Material
        foreign_key: materialId
  PurchaseOrder:
    description: 采购订单，由分货批次生成的正式订单
    properties:
      orderId:
        type: string
        required: true
        primary_key: true
        description: 订单编号（格式：PO-XXX）
      batchId:
        type: string
        required: true
        description: 关联批次ID
      supplierId:
        type: string
        required: true
        description: 供应商ID
      materialId:
        type: string
        required: true
        description: 物料ID
      quantity:
        type: integer
        required: true
        description: 订购数量
      unitPrice:
        type: number
        required: false
        description: 单价
      totalAmount:
        type: number
        required: false
        description: 总金额
      orderDate:
        type: string
        required: false
        description: 下单日期
      deliveryDate:
        type: string
        required: false
        description: 要求交货日期
      status:
        type: string
        required: true
        description: 状态（pending/approved/shipped/received/cancelled）
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      generatedFrom:
        target: AllocationBatch
        foreign_key: batchId
      placedAt:
        target: Supplier
        foreign_key: supplierId
      ordersMaterial:
        target: Material
        foreign_key: materialId
  SupplierScore:
    description: 供应商绩效评分记录
    properties:
      scoreId:
        type: string
        required: true
        primary_key: true
        description: 评分记录编号（格式：SCORE-XXX）
      supplierId:
        type: string
        required: true
        description: 供应商ID
      period:
        type: string
        required: true
        description: 评估周期（格式：YYYY-MM）
      deliveryScore:
        type: number
        required: true
        description: 交付评分（0-100）
      qualityScore:
        type: number
        required: true
        description: 质量评分（0-100）
      complianceScore:
        type: number
        required: false
        description: 合规评分（0-100）
      overallScore:
        type: number
        required: false
        description: 综合评分（0-100）
      evaluator:
        type: string
        required: false
        description: 评估人
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      evaluates:
        target: Supplier
        foreign_key: supplierId
  Customer:
    description: 销售订单所属客户
    properties:
      customerId:
        type: string
        primary_key: true
        required: true
        description: 客户编号
      name:
        type: string
        required: true
        description: 客户名称
      region:
        type: string
        description: 客户所在区域
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
  Order:
    description: 客户销售订单；单商品且全量由一家供应商供货，一件销售需求对应一件采购需求
    properties:
      orderId:
        type: string
        primary_key: true
        required: true
        description: 销售订单编号
      customerId:
        type: string
        required: true
        description: 客户编号
      materialId:
        type: string
        required: true
        description: 商品编号
      supplierId:
        type: string
        required: true
        description: 当前供应商编号
      salesAmount:
        type: number
        required: true
        description: 销售金额，人民币元，不等于实际损失
      quantity:
        type: integer
        required: true
        description: 需求数量，件
      bufferDays:
        type: integer
        required: true
        description: 交付缓冲天数
      lastChangeRequestId:
        type: string
        description: 最近执行的变更申请编号
      originalPurchaseOrderId:
        type: string
        description: 最初关联的采购单编号；变更供货安排不改写历史采购单
      status:
        type: string
        description: open 待交付、completed 已完成
      supplyOptionId:
        type: string
        description: 获批执行后采用的供货选项
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      customer:
        target: Customer
        foreign_key: customerId
      material:
        target: Material
        foreign_key: materialId
      supplier:
        target: Supplier
        foreign_key: supplierId
      lastChange:
        target: ChangeRequest
        foreign_key: lastChangeRequestId
      originalPurchaseOrder:
        target: PurchaseOrder
        foreign_key: originalPurchaseOrderId
      supplyOption:
        target: SupplyOption
        foreign_key: supplyOptionId
  SupplyOption:
    description: 某供应商针对某商品的候选供货方案；非供应商固定属性
    properties:
      optionId:
        type: string
        primary_key: true
        required: true
        description: 供货选项编号
      supplierId:
        type: string
        required: true
        description: 提供方编号
      materialId:
        type: string
        required: true
        description: 商品编号
      availableQuantity:
        type: integer
        required: true
        description: 可用数量，件
      extraUnitCost:
        type: number
        required: true
        description: 比原方案每件多付的人民币元
      onTime:
        type: boolean
        required: true
        description: 能否满足交付时点
      sourceSupplierId:
        type: string
        description: 所替代的原供应商；增量成本仅相对此原供货价格
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      supplier:
        target: Supplier
        foreign_key: supplierId
      material:
        target: Material
        foreign_key: materialId
      originalSupplier:
        target: Supplier
        foreign_key: sourceSupplierId
  ChangeRequest:
    description: 供应商变更申请；pending 待审批、approved 已批准、executed 已执行
    properties:
      requestId:
        type: string
        primary_key: true
        required: true
        description: 申请编号
      status:
        type: string
        required: true
        description: 申请状态
      supplierId:
        type: string
        required: true
        description: 原供应商编号
      optionId:
        type: string
        required: true
        description: 拟采用的供货选项编号
      orderIds:
        type: list<string>
        description: 受影响销售订单编号列表，用 Order 查询核对
      extraCost:
        type: number
        description: 申请时测算的额外成本
      snapshot:
        type: string
        description: 审批所依据的业务数据指纹
      createdBy:
        type: string
        description: 提交人
      createdAt:
        type: string
        description: 提交时间
      approvedBy:
        type: string
        description: 审批人
      approvedAt:
        type: string
        description: 审批时间
      executedBy:
        type: string
        description: 执行人
      executedAt:
        type: string
        description: 执行时间
      materialId:
        type: string
        description: 本次变更的物料编号
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
    links:
      originalSupplier:
        target: Supplier
        foreign_key: supplierId
      option:
        target: SupplyOption
        foreign_key: optionId
      orders:
        target: Order
        foreign_key: orderIds
      material:
        target: Material
        foreign_key: materialId
  Policy:
    description: 教学采购预算；执行时扣减，不能通过 Agent 参数扩大
    properties:
      policyId:
        type: string
        primary_key: true
        required: true
        description: 策略编号
      extraBudget:
        type: number
        required: true
        description: 剩余额外采购预算，人民币元
      dataOrigin:
        type: string
        description: upstream 原项目教学记录；mock 本轮新增教学记录
functions:
  traceOrderRelations:
    description: 实际沿订单的 customer、material、supplier 关系查询客户、商品与供应商并返回路径
    params:
      orderId:
        type: string
        required: true
        description: 销售订单编号，如 O1
    returns: object
  assessSupplierDelay:
    description: 查询供应商关联订单，按延期大于缓冲判断受影响订单并汇总销售金额和件数
    params:
      supplierId:
        type: string
        required: true
        description: 供应商编号，如 SUP-001
      materialId:
        type: string
        required: false
        description: 可选物料编号；省略则逐物料汇总
    returns: object
  assessSupplyOption:
    description: 评估替代供货方案，检查商品、供货状态、时点、数量与预算，确定性计算额外成本
    params:
      supplierId:
        type: string
        required: true
        description: 原供应商编号，如 SUP-001
      optionId:
        type: string
        required: true
        description: 供货选项编号，如 OPT-MAT-001-FAST
      budget:
        type: number
        required: false
        description: 可选的更紧预算假设，仅用于测算，不能扩大实际预算
    returns: object
  getChangeRequest:
    description: 查询申请状态、订单、提交人及审批执行记录
    params:
      requestId:
        type: string
        required: true
        description: 已存在的 CR 申请编号
    returns: object
  getProcurementOverview:
    description: 统计整个教学采购台账、销售订单、库存预留和延期影响；金额由程序计算
    params: {}
    returns: object
  compareSupplyOptions:
    description: 比较同一原供应商同物料的候选方案，逐项计算交期、数量、状态和预算约束并排序；不是AI预测
    params:
      supplierId:
        type: string
        required: true
        description: 原供应商编号
      materialId:
        type: string
        required: true
        description: 受影响物料编号
      budget:
        type: number
        required: false
        description: 更紧预算假设，不会提高真实预算
    returns: object
  aggregateOrders:
    description: 按供应商、物料、状态、销售客户汇总销售订单或采购单，返回数量、金额、Top N、总计与展示数据，金额由程序计算。两类订单不能混加。
    params:
      objectType:
        type: string
        description: Order（默认，销售）或 PurchaseOrder（采购）
      groupBy:
        type: string
        description: supplierId（默认）、materialId、status；Order还支持customerId
      filters:
        type: object
        description: 可选等值筛选字典，如 {"materialId":"MAT-001","status":"open"}
      affectedOnly:
        type: boolean
        description: 默认false；true仅汇总延期超过缓冲的open销售订单
      topN:
        type: integer
        description: 按金额降序展示前N组，1至100，默认20；总计始终覆盖全部筛选记录
    returns: object
  analyzeSupplyRisk:
    description: 分析当前分货方案的供应风险；沿用上游确定性评分规则，不是机器学习预测
    params:
      planId:
        type: string
        description: 分货计划ID
        required: true
    returns:
      type: object
      description: 风险分析报告（risk_level, single_source_dependency, capacity_warnings）
actions:
  submitSupplierChange:
    description: 提交原供应商 的替代供货方案，产生 pending 申请；需先评估并经用户确认
    target_type: ChangeRequest
    creates: true
    requires_confirmation: true
    params:
      supplierId:
        type: string
        required: true
        description: 原供应商编号
      optionId:
        type: string
        required: true
        description: 供货选项编号
  approveSupplierChange:
    description: 审批 pending 申请；仅审批员可操作，且不能审批自己提交的申请
    target_type: ChangeRequest
    requires_confirmation: true
    params:
      requestId:
        type: string
        required: true
        description: 待审批申请编号
  executeSupplierChange:
    description: 执行已批准申请；重新校验数据指纹、预算和数量，更新订单并扣减可用数量与预算
    target_type: ChangeRequest
    requires_confirmation: true
    params:
      requestId:
        type: string
        required: true
        description: 已批准申请编号
